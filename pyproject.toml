[project]
name = "nytid"
version = "11.29"
description = "TA bookings, schedules, time tracking, and task management"
authors = [
  {name = "Daniel Bosk", email = "daniel@bosk.se"}
]
maintainers = [
  {name = "Daniel Bosk", email = "dbosk@kth.se"}
]
readme = "README.md"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Topic :: Utilities"
]
requires-python = ">=3.10,<4.0"
dependencies = [
  "requests>=2.31.0,<3.0.0",
  "canvaslms (>=6.11,<7.0)",
  "ladok3 (>=5.15,<6.0)",
  "icalendar>=7.1,<8",
  "recurring-ical-events>=3,<4",
  "openpyxl>=3.0.10,<4.0.0",
  "Pillow>=9.3,<11.0",
  "typer>=0.26.7,<1.0.0",
  "click>=8.4.1,<9.0.0",
  "typerconf>=2.13,<3.0",
  "platformdirs>=4.9,<5.0",
  "cachetools>=5.3.1,<6.0.0",
  "rich>=13.0.0,<14.0.0",
  "weblogin (>=1.17,<2.0)",
  "zulipcli (>=0.11,<1.0)",
  "tzlocal (>=5.4.4,<6.0.0)"
]

[project.scripts]
nytid = "nytid.cli:cli"
prompt-nytid = "nytid.prompt:main"

[project.urls]
repository = "https://github.com/dbosk/nytid"
documentation = "https://github.com/dbosk/nytid/releases"
"Bug Tracker" = "https://github.com/dbosk/nytid/issues"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"
snoop = ">=0.4.3"
pysnooper = ">=1.2.1"
pdbpp = ">=0.10.3"

[tool.poetry]
include = [
  { path = "src/**/*.py", format = "wheel" },
  { path = "src/**/Mall_*.xlsx", format = "wheel" }
]
exclude = [
  "*/**/.gitignore",
  { path = "*/**/Makefile", format = "wheel" },
  "*/**/ltxobj",
  "*/**/.git",
  "*/**/*.csv",
  "*/**/*.xlsx"
]

[tool.black]
# Without this, black infers py314 from requires-python's open upper
# bound and then silently skips its AST-equivalence safety check on any
# older interpreter ("Python 3.13 cannot parse code formatted for
# Python 3.14"). Pin the versions we actually support so the check runs.
target-version = ["py310", "py311", "py312", "py313"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
